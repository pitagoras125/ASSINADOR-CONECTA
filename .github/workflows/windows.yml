name: Conecta PDF Windows 1.4.1
on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'instalador.iss'
      - '.github/workflows/windows.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: python -m pip install -r requirements.txt pytest pyinstaller==6.16.0
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Capturar as janelas reais
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          @'
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          from reportlab.pdfgen.canvas import Canvas
          from app import Window
          app=QApplication([])
          w=Window()
          w.resize(1280,800)
          w.show()
          app.processEvents()
          assert w.grab().save('Inicio.png')
          pdf=Canvas('Exemplo.pdf')
          pdf.setFont('Helvetica-Bold',22)
          pdf.drawString(52,746,'Proposta de servicos')
          pdf.setFont('Helvetica',12)
          pdf.drawString(52,710,'Documento de exemplo para demonstracao do Conecta PDF.')
          pdf.save()
          w.load(str(Path('Exemplo.pdf').resolve()))
          app.processEvents()
          assert w.grab().save('Leitor.png')
          w.method_picker.open()
          app.processEvents()
          assert w.method_picker.grab().save('Metodos.png')
          w.method_picker.hide()
          w.refresh_certs=lambda:None
          w.show_signer()
          w.certs.clear()
          w.certs.addItem('Certificado demonstrativo',{'name':'Empresa de Exemplo Ltda.','expires':'30/01/2028'})
          app.processEvents()
          assert w.dialog.grab().save('Certificados.png')
          w.dialog.hide()
          w.close()
          '@ | python -
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Previa-Interface-Windows
          path: |
            Inicio.png
            Leitor.png
            Metodos.png
            Certificados.png
      - name: Compilar programa
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --icon assets/app_icon.ico --add-data "assets;assets" --add-data "update_public_key.hex;." --name AssinadorConecta --collect-all cv2 --collect-all brazilfiscalreport --collect-all fpdf --collect-all barcode --collect-all PIL --collect-all pyhanko --collect-all pyhanko_certvalidator --collect-all pypdfium2 --collect-all pypdfium2_raw --copy-metadata cryptography --copy-metadata pyHanko --exclude-module PyQt6 app.py
      - name: Verificar inicialização do executável
        shell: pwsh
        run: |
          $app = Start-Process -FilePath dist/AssinadorConecta/AssinadorConecta.exe -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Programa encerrou ao iniciar: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Compilar instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Conecta-PDF-1.4.1-Instalador-Windows
          path: Output/*.exe
          retention-days: 7
      - name: Publicar instalador validado
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = 'Output/Instalar_Conecta_PDF_1.4.1.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  Instalar_Conecta_PDF_1.4.1.exe" | Out-File -Encoding ascii Output/SHA256SUMS.txt
          gh release create v1.4.1 $file Output/SHA256SUMS.txt Inicio.png Leitor.png Metodos.png Certificados.png --target $env:GITHUB_SHA --title "Conecta PDF 1.4.1 — interface para Windows" --notes "Faixa de ferramentas no topo e mais espaço para o documento. Capturas geradas pelo aplicativo com dados fictícios."
